<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pumpkin" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3b0764" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Solid dark background with rounded corners so we look right as both
       favicon and PWA icon (safe for maskable use). -->
  <rect width="512" height="512" fill="#0a0a0a" rx="96"/>
  <rect width="512" height="512" fill="url(#ambient)" rx="96"/>

  <!-- Stem -->
  <path d="M 244 120 Q 250 92 274 96 Q 292 104 278 120 Q 268 138 252 132 Z"
        fill="#3f6212" stroke="#1a2e05" stroke-width="2"/>

  <!-- Pumpkin body: layered ellipses build the ribbed silhouette -->
  <g>
    <ellipse cx="256" cy="308" rx="180" ry="160" fill="url(#pumpkin)"/>
    <ellipse cx="170" cy="308" rx="76" ry="154" fill="#7c2d12" opacity="0.55"/>
    <ellipse cx="342" cy="308" rx="76" ry="154" fill="#7c2d12" opacity="0.55"/>
    <ellipse cx="256" cy="308" rx="64" ry="152" fill="#fb923c" opacity="0.35"/>
  </g>

  <!-- Glowing triangular eyes -->
  <polygon points="180,282 244,282 212,220" fill="url(#glow)"/>
  <polygon points="332,282 268,282 300,220" fill="url(#glow)"/>

  <!-- Jack-o-lantern smile with jagged teeth -->
  <path d="M 160 348
           L 194 328 L 220 348 L 246 328 L 272 348 L 298 328 L 324 348 L 352 328 L 366 348
           L 344 396 L 288 402 L 224 402 L 168 396 Z"
        fill="url(#glow)"/>

  <!-- Subtle inner outline on the pumpkin for depth -->
  <ellipse cx="256" cy="308" rx="180" ry="160" fill="none"
           stroke="#000" stroke-opacity="0.25" stroke-width="4"/>
</svg>
