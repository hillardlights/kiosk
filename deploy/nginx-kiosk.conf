# Serves the Hillard Lights kiosk static bundle on port 80.
# All traffic is loopback-only from the kiosk browser, so no TLS
# required.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/kiosk;
    index index.html;

    # Cache static assets aggressively; index.html should always be
    # revalidated so kiosk picks up new deploys on refresh.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service worker must never be cached so PWA updates land.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Runtime config generated from /boot/firmware/kiosk.conf on boot;
    # must never be cached or edits won't apply until the cache expires.
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse-proxy to the Falcon Player on the show LAN. Lets the kiosk
    # UI call /fpp/api/... as a same-origin request, so Chromium doesn't
    # block the response reading on CORS (FPP's drogon server returns no
    # Access-Control-Allow-Origin). FPP's static-IP location is baked in
    # per the dual-homed network memory — if that ever changes, update
    # here and reload nginx.
    location /fpp/ {
        proxy_pass http://192.168.5.8/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
        # Short cache off — FPP's status endpoint changes every second.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
