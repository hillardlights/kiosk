# Serves the Hillard Lights kiosk static bundle on port 80.
# All traffic is loopback-only from the kiosk browser, so no TLS
# required.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/kiosk;
    index index.html;

    # Cache static assets aggressively; index.html should always be
    # revalidated so kiosk picks up new deploys on refresh.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service worker must never be cached so PWA updates land.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
